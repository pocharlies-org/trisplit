<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
    --r-xs: 5px; --r-sm: 7px; --r-md: 10px; --r-lg: 14px;
    --f-xxs: 10px; --f-xs: 11px; --f-sm: 12px; --f-md: 13px; --f-lg: 15px;
    --shadow-hair: 0 0 0 .5px rgb(0 0 0 / .10);
    --shadow-sm: 0 1px 2px rgb(0 0 0 / .08), var(--shadow-hair);
    --shadow-md: 0 4px 12px rgb(0 0 0 / .14), var(--shadow-hair);
    --shadow-pop: 0 12px 32px rgb(0 0 0 / .28), var(--shadow-hair);
    --accent-soft: color-mix(in srgb, AccentColor 12%, transparent);
    --accent-mid: color-mix(in srgb, AccentColor 30%, transparent);
    --accent-line: color-mix(in srgb, AccentColor 55%, transparent);
    --hair: color-mix(in srgb, CanvasText 12%, transparent);
    --fill-thin: color-mix(in srgb, CanvasText 4%, transparent);
    --fill-thick: color-mix(in srgb, CanvasText 8%, transparent);
    --ease: cubic-bezier(.32,.72,0,1);
    --t-1: 120ms var(--ease);
    --t-2: 200ms var(--ease);
    --danger: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --shadow-hair: 0 0 0 .5px rgb(255 255 255 / .10);
      --shadow-sm: 0 1px 2px rgb(0 0 0 / .30), var(--shadow-hair);
      --shadow-md: 0 4px 14px rgb(0 0 0 / .40), var(--shadow-hair);
      --shadow-pop: 0 14px 40px rgb(0 0 0 / .55), var(--shadow-hair);
      --hair: color-mix(in srgb, CanvasText 18%, transparent);
      --danger: #ff453a;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
  * { box-sizing: border-box; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }
  body { margin: 0; background: Canvas; color: CanvasText; height: 100vh; display: flex; flex-direction: column; font-size: var(--f-md); letter-spacing: -0.01em; }

  #bar { display: flex; gap: var(--sp-2); align-items: center; padding: var(--sp-3) var(--sp-4); user-select: none; }
  #bar > button, #bar > input { flex: none; }
  #profiles {
    display: flex; gap: 2px; padding: 2px; border-radius: var(--r-sm); background: var(--fill-thick);
    overflow-x: auto; flex: 0 1 auto; min-width: 0; scrollbar-width: none;
  }
  #profiles::-webkit-scrollbar { display: none; }
  button.tab {
    flex: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 3px 12px; border: 0; border-radius: calc(var(--r-sm) - 2px); background: transparent; box-shadow: none;
    color: color-mix(in srgb, CanvasText 75%, transparent);
  }
  button.tab:hover { background: color-mix(in srgb, CanvasText 6%, transparent); }
  button.tab:active { transform: none; }
  button.tab[aria-selected="true"] { background: Canvas; color: CanvasText; font-weight: 600; box-shadow: var(--shadow-sm); }
  button.tab.dragging { opacity: .4; }
  button.tab.over { box-shadow: inset 2px 0 0 AccentColor; }
  button.tab:focus-visible { outline-offset: -2px; }
  input.tab-edit {
    flex: none; width: 140px; font-size: var(--f-md); padding: 2px 8px; border: 1px solid AccentColor;
    border-radius: calc(var(--r-sm) - 2px); background: Field; color: FieldText;
  }
  input.tab-edit.invalid { border-color: var(--danger); outline: 2px solid color-mix(in srgb, var(--danger) 35%, transparent); }
  #profmenu {
    position: fixed; z-index: 50; min-width: 190px; padding: 4px; border-radius: var(--r-md);
    background: Canvas; border: 1px solid var(--hair); box-shadow: var(--shadow-pop);
  }
  #profmenu[hidden] { display: none; }
  #profmenu button { display: block; width: 100%; text-align: left; border: 0; box-shadow: none; background: transparent; padding: 5px 10px; border-radius: var(--r-xs); }
  #profmenu button:hover:not(:disabled), #profmenu button:focus-visible { background: AccentColor; color: AccentColorText; outline: none; }
  #profmenu button:disabled { opacity: .4; cursor: default; }
  #profmenu button.danger-confirm { background: var(--danger); color: #fff; }
  #profmenu hr { border: 0; border-top: 1px solid var(--hair); margin: 4px 0; }
  button {
    font-size: var(--f-md); padding: var(--sp-1) var(--sp-3); border-radius: var(--r-sm);
    background: ButtonFace; color: ButtonText;
    border: 1px solid var(--hair); box-shadow: var(--shadow-sm); cursor: pointer;
    transition: transform var(--t-1), background var(--t-1);
  }
  button:hover { background: color-mix(in srgb, ButtonFace 90%, CanvasText); }
  button:active { transform: scale(.96); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid AccentColor; outline-offset: 2px; }
  button.primary { background: AccentColor; color: AccentColorText; border-color: transparent; }
  button.primary:hover { background: color-mix(in srgb, AccentColor 88%, CanvasText); }
  button.icon { padding: var(--sp-1) var(--sp-2); display: inline-flex; align-items: center; }
  button.danger-confirm { background: var(--danger); color: #fff; border-color: transparent; }
  kbd {
    font: var(--f-xs) ui-monospace, "SF Mono", monospace;
    background: var(--fill-thick); border: 1px solid var(--hair);
    border-radius: var(--r-xs); padding: 1px 5px; color: CanvasText;
  }
  .hint { display: flex; gap: var(--sp-3); align-items: center; font-size: var(--f-xs); color: GrayText; margin-left: auto; white-space: nowrap; }
  .hint span { display: inline-flex; gap: 3px; align-items: center; }
  @media (max-width:1000px){.hint{display:none}}
  #newname { display: none; font-size: var(--f-md); padding: var(--sp-1) var(--sp-2); border: 1px solid var(--hair); border-radius: var(--r-sm); background: Field; color: FieldText; width: 140px; }

  #banner { display: none; margin: 0 var(--sp-4) var(--sp-2); padding: var(--sp-1) var(--sp-3); font-size: var(--f-sm);
    background: var(--accent-soft); border: 1px solid var(--accent-mid); border-radius: var(--r-sm);
    flex-direction: column; gap: var(--sp-1); }
  #banner .line { display: none; align-items: center; gap: var(--sp-2); }
  #banner .line.warn { color: var(--danger); }
  #banner button { font-size: var(--f-xs); padding: 2px var(--sp-2); }

  #monitors { flex: 1; position: relative; margin: 0 var(--sp-4) var(--sp-3); padding: var(--sp-3);
    background: var(--fill-thin); border-radius: var(--r-lg); min-height: 0; overflow: auto; scrollbar-width: thin; }
  .mon {
    background: Field; border-radius: var(--r-lg); box-shadow: var(--shadow-md);
    padding: var(--sp-2) var(--sp-3) var(--sp-3); display: flex; flex-direction: column;
    position: absolute; overflow: hidden; min-width: 240px; min-height: 130px;
    transition: box-shadow var(--t-1); cursor: move; touch-action: none;
  }
  .mon.primary { outline: 2px solid var(--accent-mid); outline-offset: -1px; }
  .mon.dragging-target { outline: 2px solid color-mix(in srgb, AccentColor 45%, transparent); outline-offset: -1px; }
  .monhead { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); flex-wrap: nowrap; }
  .monhead::before { content: "⠿"; color: GrayText; font-size: var(--f-sm); opacity: .6; flex-shrink: 0; }
  .monhead .idx { font: 600 var(--f-xxs)/1 ui-monospace, monospace; background: AccentColor; color: AccentColorText; border-radius: var(--r-xs); padding: 2px 4px; flex-shrink: 0; }
  .monhead .nm { font-size: var(--f-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .steppers { margin-left: auto; display: flex; gap: var(--sp-2); flex-shrink: 0; }
  .stepper { display: flex; align-items: center; gap: var(--sp-1); font-size: var(--f-xs); color: GrayText; }
  .stepper button { padding: 1px 7px; font-size: var(--f-sm); line-height: 16px; }
  .stepper .v { min-width: 12px; text-align: center; color: CanvasText; font-weight: 600; }

  .ghost { position: absolute; border: 1.5px dashed GrayText; border-radius: var(--r-lg); background: transparent; pointer-events: none; opacity: .5; }
  .guide { position: absolute; background: AccentColor; pointer-events: none; z-index: 20; }
  .guide.h { height: 1px; } .guide.v { width: 1px; }

  .grid { flex: 1; display: grid; gap: var(--sp-2); min-height: 0; }
  .slot {
    background: var(--fill-thin); border: 1.5px dashed var(--hair); border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center; padding: var(--sp-1);
    position: relative; min-height: 48px;
    transition: background var(--t-1), border-color var(--t-1), box-shadow var(--t-1);
  }
  .slot:not(.occupied):hover { border-style: solid; border-color: var(--accent-line); }
  .slot:not(.occupied):hover::after { content: "+"; font-size: var(--f-lg); font-weight: 300; color: color-mix(in srgb, AccentColor 70%, CanvasText); }
  .slot.over { border-color: AccentColor; background: var(--accent-soft); box-shadow: inset 0 0 0 1px AccentColor; }

  .chip {
    width: 100%; height: 100%; border-radius: var(--r-md); background: ButtonFace; color: ButtonText;
    border: 1px solid var(--hair); box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    cursor: grab; padding: var(--sp-1); text-align: center; position: relative;
    container-type: size; overflow: hidden;
    transition: transform var(--t-1), box-shadow var(--t-1), opacity var(--t-1);
  }
  .chip:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .chip:active { cursor: grabbing; }
  .chip.dragging, .tchip.dragging { opacity: .3; }
  body.is-dragging .chip { pointer-events: none; }
  .chip.absent { background: transparent; border-style: dashed; color: GrayText; box-shadow: none; }
  .chip .ic { width: clamp(24px, min(34cqh, 40cqw), 64px); height: clamp(24px, min(34cqh, 40cqw), 64px); object-fit: contain; flex: none; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .25)); pointer-events: none; }
  .chip .ic.fallback { display: grid; place-items: center; border-radius: 22%; background: var(--accent-soft); color: AccentColor; font-weight: 700; font-size: clamp(14px, min(18cqh, 22cqw), 32px); filter: none; }
  .chip.absent .ic { filter: grayscale(1); opacity: .45; }
  .chip .nm { font-size: clamp(13px, 10cqh, 20px); font-weight: 600; line-height: 1.2; max-width: 100%; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .chip .win { font-size: var(--f-sm); color: GrayText; line-height: 1.2; }
  @container (max-height: 90px) { .chip .kb { display: none; } }
  .chip .kb { font-size: var(--f-xs); font-family: ui-monospace, "SF Mono", monospace; color: GrayText; }
  .chip:focus-visible, .tchip:focus-visible, .slot:focus-visible { outline: 2px solid AccentColor; outline-offset: 2px; }
  .chip .x {
    position: absolute; top: var(--sp-1); right: var(--sp-1); width: 20px; height: 20px;
    padding: 0; border: 0; box-shadow: none; line-height: 1;
    display: grid; place-items: center; border-radius: 50%; cursor: pointer; opacity: 1;
    background: color-mix(in srgb, CanvasText 10%, transparent);
    color: color-mix(in srgb, CanvasText 70%, transparent);
    transition: background var(--t-1), color var(--t-1);
  }
  .chip .x svg { width: 10px; height: 10px; display: block; }
  .chip .x:hover, .chip .x:focus-visible { background: var(--danger); color: #fff; }
  .chip:has(.sp) { padding-bottom: calc(var(--sp-1) + 26px); }
  .chip .sp {
    position: absolute; bottom: var(--sp-1); width: 24px; height: 24px;
    padding: 0; background: ButtonFace; box-shadow: none; line-height: 1;
    border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
    display: grid; place-items: center; border-radius: 50%;
    color: CanvasText; font-size: var(--f-xs); cursor: pointer; opacity: .85;
    transition: opacity var(--t-1), background var(--t-1), color var(--t-1), border-color var(--t-1);
  }
  .chip .sp.left { left: var(--sp-1); }
  .chip .sp.grow { right: var(--sp-1); }
  .chip .sp.shrink { left: calc(50% - 12px); }
  .chip .sp:hover, .chip .sp:focus-visible { opacity: 1; background: color-mix(in srgb, AccentColor 14%, ButtonFace); color: AccentColor; border-color: AccentColor; }

  #tray { background: Canvas; border-top: 1px solid var(--hair); padding: var(--sp-3) var(--sp-4); max-height: 170px; overflow-y: auto; scrollbar-width: thin; }
  #chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .tchip {
    display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-sm);
    padding: 5px 10px; font-size: var(--f-xs); cursor: grab;
    background: Field; color: FieldText; border: 1px solid var(--hair); box-shadow: var(--shadow-sm);
    transition: transform var(--t-1), box-shadow var(--t-1);
  }
  .tchip .ic { width: 16px; height: 16px; object-fit: contain; flex: none; pointer-events: none; }
  .tchip:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgb(0 0 0 / .12); }
  .tchip.min { opacity: .55; }
  .tchip.placed { background: transparent; border-style: dashed; color: GrayText; }
  #chips .empty { font-size: var(--f-xs); color: GrayText; padding: 5px 0; }
</style>
</head>
<body>
  <div id="bar">
    <div id="profiles" role="tablist" aria-label="Perfiles"></div>
    <button id="new" class="icon" title="Nuevo perfil"><span style="font-size:15px;line-height:1">+</span></button>
    <input id="newname" placeholder="Nombre…" />
    <button id="profMenuBtn" class="icon" title="Más acciones del perfil" aria-label="Más acciones del perfil" aria-haspopup="menu" aria-expanded="false"><span style="font-size:15px;line-height:1">⋯</span></button>
    <button id="apply" class="primary" title="Aplicar configuración (⌘↩ aplica y cierra)">Aplicar</button>
    <button id="applyClose" title="Aplicar y cerrar (⌘↩)">Aplicar y cerrar</button>
    <span class="hint">
      <span>arrastra al hueco</span>
      <span><kbd>⌘⌥</kbd><kbd>1–9</kbd> colocar</span>
      <span><kbd>⌘⌥⇧</kbd><kbd>1–9</kbd> enfocar</span>
      <span><kbd>⌘⌥</kbd><kbd>0</kbd> aplicar</span>
      <span><kbd>⌘⌥</kbd><kbd>P</kbd> panel</span>
      <span><kbd>esc</kbd> cerrar</span>
    </span>
  </div>
  <div id="banner">
    <div id="axLine" class="line warn">
      <span>Trisplit necesita permiso de Accesibilidad para mover ventanas</span>
      <button id="openAX">Abrir Ajustes…</button>
    </div>
    <div id="monLine" class="line"><span></span></div>
    <div id="arrLine" class="line">
      <span></span>
      <button id="applyArr" class="primary" style="display:none">Aplicar a macOS</button>
      <button id="resetArr">Restablecer</button>
    </div>
  </div>
  <div id="monitors"></div>
  <div id="tray">
    <div id="chips"></div>
  </div>
<div id="profmenu" role="menu" hidden></div>
<script>
let S = null;
let W = null;

let arrDrag = null;
// While a chip is being dragged, engine pushes are parked in pendingState:
// re-rendering would destroy the dragged node and WebKit cancels the drag.
let chipDragging = false;
let chipDragStart = 0;
let pendingState = null;
// A drag older than this is stale (dragend never reached us): stop parking pushes.
const CHIP_DRAG_STALE_MS = 15000;

// Tray/slot identity: bare "App" is the same window as "App#1".
function specKey(a) { return /#\d+$/.test(a) ? a : a + "#1"; }

// Slot spec -> comparable app name: drops "#n", Unicode format chars (U+200E…), case.
const ALIASES = { "Code": "Visual Studio Code", "Visual Studio Code": "Code" };
function normApp(n) { return (n || "").replace(/\p{Cf}/gu, "").trim().toLowerCase(); }
function specApp(spec) { return spec.replace(/#\d+$/, ""); }
// Apply never launches apps: a slot whose app is not open is skipped.
function appPresent(spec) {
  const name = specApp(spec);
  const want = new Set([normApp(name), normApp(ALIASES[name])]);
  want.delete("");
  return (S.apps || []).some((a) => want.has(normApp(a.name)));
}

function post(msg){ webkit.messageHandlers.trisplit.postMessage(JSON.stringify(msg)); }
function screens() { return S.screens; }
function cfg() { return S.configs[S.active - 1]; }
function isPrimary(name) { return name === S.primary; }
function arrange() { return S.arrange || {}; }

function effRect(s) {
  const off = arrange()[s.name];
  if (off) {
    const p = screens().find(o => o.name === S.primary) || screens()[0];
    return { x: p.x + (+off.dx || 0), y: p.y + (+off.dy || 0), w: s.w, h: s.h };
  }
  return { x: s.x, y: s.y, w: s.w, h: s.h };
}

function rebuildGroups() {
  W = new Map();
  for (const s of screens()) {
    const m = cfg().monitors[s.name];
    if (m) W.set(s.name, { cols: m.cols, rows: m.rows, slots: normalizeSpans(m.slots.map(a => a || ""), m.cols) });
    else W.set(s.name, { cols: 3, rows: 1, slots: ["", "", ""] });
  }
  for (const name of Object.keys(cfg().monitors))
    if (!W.has(name)) W.set(name, cfg().monitors[name]);
}
function groups() { if (!W) rebuildGroups(); return W; }

// "<" = continuation of the slot to its left in the same row (mirrors Core/Geometry.swift).
const SPAN = "<";
// Columns covered by 0-based slot j: 0 for a "<" cell, 1 for an empty owner.
function spanOf(slots, j, cols) {
  const c = Math.max(cols, 1);
  if (slots[j] === SPAN) return 0;
  if (!slots[j]) return 1;
  let n = 1;
  while ((j + n) % c !== 0 && j + n < slots.length && slots[j + n] === SPAN) n++;
  return n;
}
// Orphan "<" (first column of a row, or right of an empty slot) become "".
function normalizeSpans(slots, cols) {
  const c = Math.max(cols, 1);
  const out = slots.slice();
  for (let k = 0; k < out.length; k++)
    if (out[k] === SPAN && (k % c === 0 || !out[k - 1])) out[k] = "";
  return out;
}
// Free the "<" cells owned by slot j (the owner itself is left untouched).
function clearSpan(m, j) {
  const n = spanOf(m.slots, j, m.cols);
  for (let k = 1; k < n; k++) m.slots[j + k] = "";
}
// Span edits on owner j (0-based). Each returns the new owner index, or -1 when not allowed.
function canGrowRight(m, j) {
  const e = j + spanOf(m.slots, j, m.cols);
  return e % Math.max(m.cols, 1) !== 0 && e < m.slots.length && m.slots[e] === "";
}
function canGrowLeft(m, j) {
  return j % Math.max(m.cols, 1) !== 0 && m.slots[j - 1] === "";
}
function growRight(m, j) {
  if (!m.slots[j] || m.slots[j] === SPAN || !canGrowRight(m, j)) return -1;
  m.slots[j + spanOf(m.slots, j, m.cols)] = SPAN;
  return j;
}
function growLeft(m, j) {
  if (!m.slots[j] || m.slots[j] === SPAN || !canGrowLeft(m, j)) return -1;
  m.slots[j - 1] = m.slots[j]; m.slots[j] = SPAN; // the "<" chain after j stays intact
  return j - 1;
}
function shrink(m, j) {
  const n = spanOf(m.slots, j, m.cols);
  if (!m.slots[j] || n < 2) return -1;
  m.slots[j + n - 1] = "";
  return j;
}

function persist() {
  const g = groups();
  const monitors = {};
  for (const [name, m] of g) monitors[name] = { cols: m.cols, rows: m.rows, slots: m.slots };
  cfg().monitors = monitors;
  post({ action: "save", configs: S.configs, active: S.active });
  render();
}

function flatIndex(screen, idx) {
  let n = 0;
  for (const s of screens()) {
    const m = groups().get(s.name);
    if (!m) continue;
    for (let i = 1; i <= m.slots.length; i++) {
      if (m.slots[i - 1] === SPAN) continue; // hotkeys address owners only, like flatSlots
      n++;
      if (s.name === screen && i === idx) return n;
    }
  }
  return 0;
}

function setColsRows(name, dCols, dRows) {
  const m = groups().get(name);
  const cols = Math.min(6, Math.max(1, m.cols + dCols));
  const rows = Math.min(4, Math.max(1, m.rows + dRows));
  const total = cols * rows;
  const next = [];
  for (let i = 0; i < total; i++) next.push(m.slots[i] || "");
  m.cols = cols; m.rows = rows; m.slots = normalizeSpans(next, cols);
  persist();
}

let mapScale = 1, mapMinX = 0, mapMinY = 0;

function render() {
  if (!S || !cfg()) return;
  rebuildGroups();
  renderProfiles();

  const banner = document.getElementById("banner");
  const hasArr = Object.keys(arrange()).length > 0;
  const noAX = S.axTrusted === false;
  const live = new Set(screens().map(o => o.name));
  const missing = Object.keys(cfg().monitors).filter(n => !live.has(n)).length;
  banner.style.display = (hasArr || noAX || missing) ? "flex" : "none";
  document.getElementById("axLine").style.display = noAX ? "flex" : "none";
  const monLine = document.getElementById("monLine");
  monLine.style.display = missing ? "flex" : "none";
  monLine.querySelector("span").textContent = missing + " monitor(es) de esta configuración no están conectados — sus huecos se conservan";
  document.getElementById("arrLine").style.display = hasArr ? "flex" : "none";
  if (hasArr) {
    const span = document.getElementById("arrLine").querySelector("span");
    const applyBtn = document.getElementById("applyArr");
    if (S.hasDisplayplacer) {
      span.textContent = "Disposición manual pendiente — aplícala a macOS";
      applyBtn.style.display = "";
    } else {
      span.textContent = "Disposición manual — solo afecta a este mapa (instala displayplacer para aplicarla a macOS)";
      applyBtn.style.display = "none";
    }
  }

  const mon = document.getElementById("monitors");
  mon.replaceChildren();
  const rects = {};
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of screens()) {
    const r = effRect(s);
    rects[s.name] = r;
    minX = Math.min(minX, r.x); minY = Math.min(minY, r.y);
    maxX = Math.max(maxX, r.x + r.w); maxY = Math.max(maxY, r.y + r.h);
  }
  const bw = maxX - minX || 1, bh = maxY - minY || 1;
  const cs = getComputedStyle(mon);
  const cw = mon.clientWidth - parseFloat(cs.paddingLeft) * 2;
  const ch = mon.clientHeight - parseFloat(cs.paddingTop) * 2;
  const sc = Math.min(cw / bw, ch / bh);
  mapScale = sc; mapMinX = minX; mapMinY = minY;
  const desk = document.createElement("div");
  desk.id = "desk";
  desk.style.cssText = "position:absolute;left:" + (parseFloat(cs.paddingLeft) + (cw - bw * sc) / 2) + "px;top:" + (parseFloat(cs.paddingTop) + (ch - bh * sc) / 2) + "px;width:" + bw * sc + "px;height:" + bh * sc + "px;";
  mon.appendChild(desk);

  screens().forEach((s, i) => {
    const m = groups().get(s.name);
    const r = rects[s.name];
    const box = document.createElement("div");
    box.className = "mon" + (isPrimary(s.name) ? " primary" : "");
    box.dataset.name = s.name;
    box.style.left = (r.x - minX) * sc + "px";
    box.style.top = (r.y - minY) * sc + "px";
    box.style.width = Math.max(240, s.w * sc) + "px";
    box.style.height = Math.max(130, s.h * sc) + "px";

    const head = document.createElement("div");
    head.className = "monhead";
    head.title = isPrimary(s.name) ? s.name + " (principal) — arrastra para moverla" : "Arrastra para reordenar la disposición";
    if (!isPrimary(s.name)) {
      const idx = document.createElement("span");
      idx.className = "idx"; idx.textContent = i + 1;
      head.appendChild(idx);
    }
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = s.name;
    head.appendChild(nm);
    const st = document.createElement("div");
    st.className = "steppers";
    for (const [label, val, dc, dr, max, noun] of [["col", m.cols, 1, 0, 6, "columna"], ["fil", m.rows, 0, 1, 4, "fila"]]) {
      const sp = document.createElement("span");
      sp.className = "stepper";
      sp.append(label + " ");
      const minus = document.createElement("button");
      minus.textContent = "−";
      minus.title = "Quitar " + noun; minus.setAttribute("aria-label", minus.title);
      minus.disabled = val <= 1;
      minus.onclick = () => setColsRows(s.name, -dc, -dr);
      const v = document.createElement("span");
      v.className = "v"; v.textContent = val;
      const plus = document.createElement("button");
      plus.textContent = "+";
      plus.title = "Añadir " + noun; plus.setAttribute("aria-label", plus.title);
      plus.disabled = val >= max;
      plus.onclick = () => setColsRows(s.name, dc, dr);
      sp.append(minus, v, plus);
      st.appendChild(sp);
    }
    head.appendChild(st);
    box.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "grid";
    grid.style.gridTemplateColumns = "repeat(" + m.cols + ", 1fr)";
    grid.style.gridTemplateRows = "repeat(" + m.rows + ", 1fr)";
    m.slots.forEach((app, j) => {
      if (app === SPAN) return; // covered by the owner to its left
      const span = spanOf(m.slots, j, m.cols);
      const slot = document.createElement("div");
      if (span > 1) slot.style.gridColumn = "span " + span;
      slot.className = "slot" + (app ? " occupied" : "");
      const label = app ? app.replace(/#(\d+)$/, " · ventana $1") : "";
      slot.setAttribute("role", "group");
      slot.setAttribute("aria-label", "Hueco " + (j + 1) + " de " + s.name + (app ? ": " + label : ": vacío"));
      if (!app) slot.tabIndex = 0;
      if (app) {
        const chip = document.createElement("div");
        chip.className = "chip";
        if (!appPresent(app)) { chip.classList.add("absent"); chip.title = "No está abierta"; }
        chip.draggable = true;
        chip.tabIndex = 0;
        chip.setAttribute("role", "button");
        chip.setAttribute("aria-label", label + " — Supr para quitar");
        const n = flatIndex(s.name, j + 1);
        const x = document.createElement("button");
        x.className = "x"; x.title = "Quitar"; x.setAttribute("aria-label", "Quitar"); x.innerHTML = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
        const nmEl = document.createElement("span");
        const baseName = app.replace(/#(\d+)$/, "");
        const winM = /#(\d+)$/.exec(app);
        const ic = document.createElement("img");
        ic.className = "ic"; ic.alt = ""; ic.draggable = false; ic.src = iconURL(app);
        ic.onerror = () => {
          const fb = document.createElement("span");
          fb.className = "ic fallback"; fb.setAttribute("aria-hidden", "true");
          fb.textContent = (stripFmt(baseName).charAt(0) || "?").toUpperCase();
          ic.replaceWith(fb);
        };
        nmEl.className = "nm"; nmEl.textContent = baseName;
        chip.append(x, ic, nmEl);
        if (winM) {
          const win = document.createElement("span");
          win.className = "win"; win.textContent = "ventana " + winM[1];
          chip.appendChild(win);
        }
        if (n <= 9) {
          const kb = document.createElement("span");
          kb.className = "kb"; kb.textContent = "⌘⌥" + n;
          chip.appendChild(kb);
        }
        // ◀ / ▶ grow into the empty slot on the left / right (same row); − gives back the last column.
        const apply = (fn) => {
          const owner = fn(m, j);
          if (owner < 0) return false;
          persist();
          post({ action: "liveMove", screen: s.name, idx: owner + 1, app });
          return true;
        };
        const spBtn = (cls, glyph, title, fn) => {
          const b = document.createElement("button");
          b.className = "sp " + cls; b.title = title; b.textContent = glyph;
          b.setAttribute("aria-label", title);
          b.draggable = false;
          b.onmousedown = (ev) => ev.stopPropagation();
          b.ondragstart = (ev) => { ev.preventDefault(); ev.stopPropagation(); };
          b.onclick = (ev) => { ev.stopPropagation(); apply(fn); };
          chip.appendChild(b);
        };
        if (canGrowLeft(m, j)) spBtn("left", "◀", "Ocupar también el hueco de la izquierda (⇧←)", growLeft);
        if (span > 1) spBtn("shrink", "−", "Ocupar una columna menos (⇧↓)", shrink);
        if (canGrowRight(m, j)) spBtn("grow", "▶", "Ocupar también el hueco de la derecha (⇧→)", growRight);
        x.onclick = (ev) => { ev.stopPropagation(); clearSpan(m, j); m.slots[j] = ""; persist(); };
        const spanKeys = { ArrowLeft: growLeft, ArrowRight: growRight, ArrowDown: shrink };
        chip.onkeydown = (ev) => {
          if (ev.shiftKey && spanKeys[ev.key]) {
            ev.preventDefault(); ev.stopPropagation();
            apply(spanKeys[ev.key]);
            return;
          }
          if (ev.key !== "Delete" && ev.key !== "Backspace") return;
          ev.preventDefault(); ev.stopPropagation();
          clearSpan(m, j); m.slots[j] = ""; persist();
        };
        chip.ondragstart = (e) => {
          e.dataTransfer.setData("text/plain", JSON.stringify({ app, screen: s.name, idx: j + 1 }));
          e.dataTransfer.effectAllowed = "move";
          chipDragging = true; chipDragStart = Date.now();
          // Deferred: pointer-events:none on .chip during dragstart aborts the drag in WebKit.
          setTimeout(() => { chip.classList.add("dragging"); document.body.classList.add("is-dragging"); }, 0);
        };
        chip.ondragend = () => {
          chip.classList.remove("dragging");
          document.body.classList.remove("is-dragging");
          endChipDrag();
        };
        slot.appendChild(chip);
      }
      slot.ondragover = (e) => { if (e.dataTransfer && e.dataTransfer.types && [...e.dataTransfer.types].includes(PROFILE_DT)) return; e.preventDefault(); slot.classList.add("over"); };
      slot.ondragleave = () => slot.classList.remove("over");
      slot.ondrop = (e) => {
        e.preventDefault();
        slot.classList.remove("over");
        if (e.dataTransfer.types && [...e.dataTransfer.types].includes(PROFILE_DT)) return; // a profile tab, not an app
        document.body.classList.remove("is-dragging");
        // Fold in any state parked during the drag first, then apply the user's move on top.
        chipDragging = false;
        if (pendingState) { const ps = pendingState; pendingState = null; S = ps; W = null; }
        let p; try { p = JSON.parse(e.dataTransfer.getData("text/plain")); } catch { render(); return; }
        const tgt = groups().get(s.name);
        if (!tgt) { render(); return; }
        // A move resets spans on both ends: the new tenant starts at one column.
        if (!p.tray && p.screen === s.name && p.idx === j + 1) { render(); return; }
        if (p.tray) {
          clearSpan(tgt, j);
          tgt.slots[j] = p.app;
          persist(); // save before liveMove: the engine must know the new layout first
          post({ action: "liveMove", screen: s.name, idx: j + 1, app: p.app });
          return;
        } else {
          const src = groups().get(p.screen);
          if (!src || !(p.idx >= 1 && p.idx <= src.slots.length)) { render(); return; }
          clearSpan(tgt, j);
          clearSpan(src, p.idx - 1);
          const tmp = tgt.slots[j];
          tgt.slots[j] = src.slots[p.idx - 1];
          src.slots[p.idx - 1] = tmp;
          persist(); // save before liveMove: the engine must know the new layout first
          if (tgt.slots[j]) post({ action: "liveMove", screen: s.name, idx: j + 1, app: tgt.slots[j] });
          if (src.slots[p.idx - 1]) post({ action: "liveMove", screen: p.screen, idx: p.idx, app: src.slots[p.idx - 1] });
        }
      };
      grid.appendChild(slot);
    });
    box.appendChild(grid);
    desk.appendChild(box);

    box.onpointerdown = (e) => startArrangeDrag(e, s, box);
  });
  renderChips();
}

function startArrangeDrag(e, s, box) {
  if (e.target.closest("button, .chip, input, select")) return;
  e.preventDefault();
  const desk = document.getElementById("desk");
  const sc = mapScale;
  const p = screens().find(o => o.name === S.primary) || screens()[0];
  const start = effRect(s);
  const neighbors = screens().filter(o => o.name !== s.name).map(o => effRect(o));
  const ghost = document.createElement("div");
  ghost.className = "ghost";
  ghost.style.cssText = "left:" + box.style.left + ";top:" + box.style.top + ";width:" + box.style.width + ";height:" + box.style.height + ";";
  desk.appendChild(ghost);
  box.classList.add("lifted");
  box.style.boxShadow = "var(--shadow-pop)";
  box.style.zIndex = 10;
  const sx = e.clientX, sy = e.clientY, ox = box.offsetLeft, oy = box.offsetTop;
  const guides = [];
  try { box.setPointerCapture(e.pointerId); } catch {}

  function clearGuides() { guides.forEach(g => g.remove()); guides.length = 0; }
  function guideV(x, y0, y1) {
    const g = document.createElement("div"); g.className = "guide v";
    g.style.cssText = "left:" + x + "px;top:" + y0 + "px;height:" + (y1 - y0) + "px;";
    desk.appendChild(g); guides.push(g);
  }
  function guideH(y, x0, x1) {
    const g = document.createElement("div"); g.className = "guide h";
    g.style.cssText = "top:" + y + "px;left:" + x0 + "px;width:" + (x1 - x0) + "px;";
    desk.appendChild(g); guides.push(g);
  }

  let moved = false, lastX = start.x, lastY = start.y;
  const onMove = (ev) => {
    if (ev.clientX !== sx || ev.clientY !== sy) moved = true;
    if (!moved) return;
    let rx = start.x + (ev.clientX - sx) / sc;
    let ry = start.y + (ev.clientY - sy) / sc;
    const rect = { x: rx, y: ry, w: s.w, h: s.h };
    const T = 6;
    clearGuides();
    document.querySelectorAll(".mon.dragging-target").forEach(b => b.classList.remove("dragging-target"));
    let snappedX = false, snappedY = false;
    for (const n of neighbors) {
      const nRect = { x: n.x, y: n.y, w: n.w, h: n.h };
      const pairsX = [
        [rect.x, nRect.x], [rect.x + rect.w, nRect.x + nRect.w],
        [rect.x + rect.w / 2, nRect.x + nRect.w / 2],
      ];
      for (const [a, b] of pairsX) {
        if (Math.abs(a - b) <= T) { rx += b - a; snappedX = true; }
      }
      const pairsY = [
        [rect.y, nRect.y], [rect.y + rect.h, nRect.y + nRect.h],
        [rect.y + rect.h / 2, nRect.y + nRect.h / 2],
      ];
      for (const [a, b] of pairsY) {
        if (Math.abs(a - b) <= T) { ry += b - a; snappedY = true; }
      }
    }
    if (snappedX) {
      const gx = (rx - mapMinX) * sc;
      let y0 = Infinity, y1 = -Infinity;
      for (const n of neighbors) { y0 = Math.min(y0, (n.y - mapMinY) * sc); y1 = Math.max(y1, (n.y + n.h - mapMinY) * sc); }
      guideV(gx, y0, y1);
    } else {
      rx = Math.round(rx / 16) * 16;
    }
    if (snappedY) {
      const gy = (ry - mapMinY) * sc;
      let x0 = Infinity, x1 = -Infinity;
      for (const n of neighbors) { x0 = Math.min(x0, (n.x - mapMinX) * sc); x1 = Math.max(x1, (n.x + n.w - mapMinX) * sc); }
      guideH(gy, x0, x1);
    } else {
      ry = Math.round(ry / 16) * 16;
    }
    for (const n of neighbors) {
      if (rx < n.x + n.w && rx + s.w > n.x && ry < n.y + n.h && ry + s.h > n.y) {
        const ox = Math.min(rx + s.w - n.x, n.x + n.w - rx);
        const oy = Math.min(ry + s.h - n.y, n.y + n.h - ry);
        if (ox < oy) rx += (rx + s.w / 2 < n.x + n.w / 2) ? -ox : ox;
        else ry += (ry + s.h / 2 < n.y + n.h / 2) ? -oy : oy;
      }
    }
    box.style.left = (rx - mapMinX) * sc + "px";
    box.style.top = (ry - mapMinY) * sc + "px";
    lastX = rx; lastY = ry;
  };
  const onUp = () => end(false);
  const onCancel = () => end(true);
  const end = (cancelled) => {
    if (arrDrag !== end) return;
    arrDrag = null;
    box.removeEventListener("pointermove", onMove);
    box.removeEventListener("pointerup", onUp);
    box.removeEventListener("pointercancel", onCancel);
    box.removeEventListener("lostpointercapture", onCancel);
    try { if (box.hasPointerCapture(e.pointerId)) box.releasePointerCapture(e.pointerId); } catch {}
    clearGuides();
    ghost.remove();
    document.querySelectorAll(".mon.dragging-target").forEach(b => b.classList.remove("dragging-target"));
    box.classList.remove("lifted");
    box.style.boxShadow = "";
    box.style.zIndex = "";
    if (!cancelled && moved && Number.isFinite(lastX) && Number.isFinite(lastY)) {
      if (!S.arrange || Array.isArray(S.arrange)) S.arrange = {};
      S.arrange[s.name] = { dx: Math.round(lastX - p.x), dy: Math.round(lastY - p.y) };
      post({ action: "arrange", offsets: S.arrange });
    }
    render();
  };
  if (arrDrag) arrDrag(true);
  arrDrag = end;
  box.addEventListener("pointermove", onMove);
  box.addEventListener("pointerup", onUp);
  box.addEventListener("pointercancel", onCancel);
  box.addEventListener("lostpointercapture", onCancel);
}

function placeInFirstFree(spec) {
  for (const s of screens()) {
    const m = groups().get(s.name);
    for (let i = 0; i < m.slots.length; i++) {
      if (m.slots[i] === "") {
        m.slots[i] = spec;
        persist();
        post({ action: "liveMove", screen: s.name, idx: i + 1, app: spec });
        return;
      }
    }
  }
}

function stripFmt(t) { return t.replace(/[\u200e\u200f\u200b-\u200d\u2060\ufeff]/g, "").trim(); }

function iconURL(name) { return "trisplit-icon://app/" + encodeURIComponent(name.replace(/#\d+$/, "")); }

function renderChips() {
  const used = new Set();
  for (const m of groups().values())
    for (const a of m.slots) if (a && a !== SPAN) used.add(specKey(a));
  const box = document.getElementById("chips");
  box.replaceChildren();
  let shown = 0;
  for (const app of S.apps) {
    const n = app.count || 1;
    for (let i = 1; i <= n; i++) {
      const spec = i > 1 ? app.name + "#" + i : app.name;
      const c = document.createElement("div");
      c.className = "tchip";
      let label = app.name;
      if (n > 1) {
        const t = ((app.titles && app.titles[i - 1]) || "").slice(0, 22);
        label = app.name + " · ventana " + i + (t ? " — " + t : "");
      }
      const tic = document.createElement("img");
      tic.className = "ic"; tic.alt = ""; tic.draggable = false;
      tic.src = iconURL(app.name);
      tic.onerror = () => { tic.style.display = "none"; };
      c.append(tic, document.createTextNode(label));
      c.draggable = true;
      c.tabIndex = 0;
      c.setAttribute("role", "button");
      c.setAttribute("aria-label", label + " — Intro para colocar en el primer hueco libre");
      shown++;
      if (used.has(specKey(spec))) c.classList.add("placed");
      if (app.minimized && app.minimized[i - 1]) { c.classList.add("min"); c.title = "Minimizada"; }
      c.ondragstart = (e) => {
        e.dataTransfer.setData("text/plain", JSON.stringify({ app: spec, tray: true }));
        e.dataTransfer.effectAllowed = "copy";
        chipDragging = true; chipDragStart = Date.now();
        setTimeout(() => { c.classList.add("dragging"); document.body.classList.add("is-dragging"); }, 0);
      };
      c.ondragend = () => {
        c.classList.remove("dragging");
        document.body.classList.remove("is-dragging");
        endChipDrag();
      };
      c.ondblclick = () => placeInFirstFree(spec);
      c.onkeydown = (e) => {
        if (e.key !== "Enter" || e.metaKey) return;
        e.preventDefault();
        placeInFirstFree(spec);
      };
      box.appendChild(c);
    }
  }
  if (!shown) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No hay apps con ventanas visibles";
    box.appendChild(e);
  }
}

// ---- Profiles (tab strip, rename, duplicate, reorder, menu) ----
const PROFILE_DT = "application/x-trisplit-profile";
const profilesEl = document.getElementById("profiles");
const profMenu = document.getElementById("profmenu");
const profMenuBtn = document.getElementById("profMenuBtn");
let editing = null;      // { i } while a tab is replaced by its rename input
let menuOpen = false;
let profDragging = false;
let delTimer = null;
const profileBusy = () => !!editing || menuOpen || profDragging;

function saveConfigs() { post({ action: "save", configs: S.configs, active: S.active }); }
function tabEls() { return [...profilesEl.querySelectorAll("button.tab")]; }

// Leaves a busy state (rename/menu/drag). `changed`: a save was posted, so any parked push
// is older than our edit and the engine will push again after the save: drop it.
function endBusy(changed) {
  if (profileBusy() || chipDragging) return;
  const ps = pendingState; pendingState = null;
  if (ps && !changed) { S = ps; W = null; }
  render();
}

function renderProfiles() {
  if (editing && profilesEl.querySelector("input.tab-edit")) return; // never destroy a live rename input
  const hadFocus = profilesEl.contains(document.activeElement);
  profilesEl.replaceChildren();
  S.configs.forEach((c, i) => {
    const t = document.createElement("button");
    const on = i === S.active - 1;
    t.className = "tab"; t.setAttribute("role", "tab");
    t.setAttribute("aria-selected", on ? "true" : "false");
    t.tabIndex = on ? 0 : -1;
    t.textContent = c.name; t.title = c.name;
    t.draggable = true;
    t.onclick = () => activateProfile(i);
    t.ondblclick = () => startRename(i);
    t.oncontextmenu = (e) => { e.preventDefault(); if (i !== S.active - 1) activateProfile(i); openMenu(e.clientX, e.clientY); };
    t.onkeydown = (e) => onTabKey(e, i);
    t.ondragstart = (e) => {
      e.dataTransfer.setData(PROFILE_DT, String(i));
      e.dataTransfer.effectAllowed = "move";
      profDragging = true;
      setTimeout(() => t.classList.add("dragging"), 0);
    };
    t.ondragover = (e) => {
      const ty = e.dataTransfer && e.dataTransfer.types;
      if (ty && !ty.includes(PROFILE_DT)) return;
      e.preventDefault(); t.classList.add("over");
    };
    t.ondragleave = () => t.classList.remove("over");
    t.ondrop = (e) => {
      e.preventDefault(); e.stopPropagation();
      t.classList.remove("over");
      const from = parseInt(e.dataTransfer.getData(PROFILE_DT), 10);
      profDragging = false;
      if (Number.isInteger(from) && from >= 0 && from < S.configs.length && from !== i) moveProfile(from, i);
      else endBusy(false);
    };
    t.ondragend = () => { t.classList.remove("dragging"); if (profDragging) { profDragging = false; endBusy(false); } };
    profilesEl.appendChild(t);
  });
  const act = tabEls()[S.active - 1];
  if (act) { if (hadFocus) act.focus(); act.scrollIntoView({ block: "nearest", inline: "nearest" }); }
}

function activateProfile(i) {
  if (i === S.active - 1) return;
  S.active = i + 1; W = null;
  saveConfigs();
  render();
}

function moveProfile(from, to) {
  to = Math.max(0, Math.min(S.configs.length - 1, to));
  if (from === to) { endBusy(false); return; }
  const act = S.configs[S.active - 1];
  const [c] = S.configs.splice(from, 1);
  S.configs.splice(to, 0, c);
  S.active = S.configs.indexOf(act) + 1; // the active profile stays active wherever it lands
  W = null;
  saveConfigs();
  endBusy(true);
}

function onTabKey(e, i) {
  const n = S.configs.length;
  if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    e.preventDefault();
    const to = i + (e.key === "ArrowLeft" ? -1 : 1);
    if (to < 0 || to >= n) return;
    moveProfile(i, to);
    const t = tabEls()[to]; if (t) t.focus();
    return;
  }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    const t = tabEls()[(i + (e.key === "ArrowLeft" ? -1 : 1) + n) % n];
    if (t) { t.tabIndex = 0; t.focus(); }
    return;
  }
  if (e.key === "F2" || (e.key === "Enter" && i === S.active - 1)) { e.preventDefault(); startRename(i); return; }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    activateProfile(i);
    const t = tabEls()[i]; if (t) t.focus();
  }
}

// ---- rename ----
function nameError(v, i) {
  if (!v) return "El nombre no puede estar vacío";
  if (S.configs.some((c, k) => k !== i && c.name.toLowerCase() === v.toLowerCase())) return "Ya existe un perfil con ese nombre";
  return "";
}
function startRename(i) {
  if (editing || !S.configs[i]) return;
  closeMenu(false);
  const t = tabEls()[i];
  if (!t) return;
  editing = { i };
  const inp = document.createElement("input");
  inp.className = "tab-edit"; inp.value = S.configs[i].name;
  inp.setAttribute("aria-label", "Nombre del perfil");
  inp.oninput = () => { inp.classList.remove("invalid"); inp.title = ""; };
  inp.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); commitRename(inp, true); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cancelRename(); }
  };
  inp.onblur = () => commitRename(inp, false);
  t.replaceWith(inp);
  inp.focus(); inp.select();
}
function commitRename(inp, stayIfInvalid) {
  if (!editing) return;
  const i = editing.i;
  const v = inp.value.trim();
  const err = v === S.configs[i].name ? "" : nameError(v, i);
  if (err) {
    if (stayIfInvalid) { inp.classList.add("invalid"); inp.title = err; return; }
    cancelRename(); return;
  }
  editing = null;
  const changed = v !== S.configs[i].name;
  if (changed) { S.configs[i].name = v; saveConfigs(); }
  endBusy(changed);
  const t = tabEls()[i]; if (t) t.focus();
}
function cancelRename() {
  if (!editing) return;
  const i = editing.i;
  editing = null;
  endBusy(false);
  const t = tabEls()[i]; if (t) t.focus();
}

// ---- duplicate ----
function duplicateActive() {
  closeMenu(false);
  const src = cfg();
  const copy = JSON.parse(JSON.stringify(src));
  const taken = (n) => S.configs.some((c) => c.name.toLowerCase() === n.toLowerCase());
  let name = src.name + " copia", k = 2;
  while (taken(name)) name = src.name + " copia " + k++;
  copy.name = name;
  S.configs.splice(S.active, 0, copy);
  S.active += 1; W = null;
  saveConfigs();
  endBusy(true);
  startRename(S.active - 1);
}

// ---- menu ----
let delArmed2 = false;
function openMenu(x, y) {
  if (menuOpen) closeMenu(false);
  const i = S.active - 1, n = S.configs.length;
  const items = [
    ["Renombrar", false, () => startRename(S.active - 1)],
    ["Duplicar", false, duplicateActive],
    ["Mover a la izquierda", i === 0, () => { closeMenu(false); moveProfile(i, i - 1); }],
    ["Mover a la derecha", i >= n - 1, () => { closeMenu(false); moveProfile(i, i + 1); }],
    "-",
    ["Eliminar", n <= 1, null],
  ];
  profMenu.replaceChildren();
  for (const it of items) {
    if (it === "-") { profMenu.appendChild(document.createElement("hr")); continue; }
    const b = document.createElement("button");
    b.setAttribute("role", "menuitem"); b.textContent = it[0]; b.disabled = it[1];
    if (it[0] === "Eliminar") {
      b.className = "del-item";
      b.title = it[1] ? "No se puede eliminar el único perfil" : "";
      b.onclick = () => {
        if (b.disabled) return;
        if (!delArmed2) {
          delArmed2 = true; b.classList.add("danger-confirm");
          b.textContent = "¿Seguro? Pulsa de nuevo";
          b.title = 'Pulsa de nuevo para eliminar "' + cfg().name + '"';
          delTimer = setTimeout(disarmDel, 2500);
          return;
        }
        disarmDel();
        S.configs.splice(S.active - 1, 1);
        S.active = Math.min(S.active, S.configs.length);
        W = null;
        saveConfigs();
        closeMenu(true);
      };
    } else b.onclick = it[2];
    profMenu.appendChild(b);
  }
  profMenu.hidden = false;
  const r = profMenu.getBoundingClientRect();
  const bx = profMenuBtn.getBoundingClientRect();
  const px = x == null ? bx.left : x, py = y == null ? bx.bottom + 4 : y;
  profMenu.style.left = Math.max(4, Math.min(px, window.innerWidth - r.width - 4)) + "px";
  profMenu.style.top = Math.max(4, Math.min(py, window.innerHeight - r.height - 4)) + "px";
  menuOpen = true;
  profMenuBtn.setAttribute("aria-expanded", "true");
  const first = profMenu.querySelector("button:not(:disabled)"); if (first) first.focus();
}
function disarmDel() { clearTimeout(delTimer); delTimer = null; delArmed2 = false; }
function closeMenu(changed) {
  if (!menuOpen) return;
  disarmDel();
  menuOpen = false;
  profMenu.hidden = true; profMenu.replaceChildren();
  profMenuBtn.setAttribute("aria-expanded", "false");
  endBusy(changed);
}
profMenuBtn.onclick = () => { if (menuOpen) closeMenu(false); else openMenu(null, null); };
profMenu.onkeydown = (e) => {
  const bs = [...profMenu.querySelectorAll("button:not(:disabled)")];
  const k = bs.indexOf(document.activeElement);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    bs[(k + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length].focus();
  }
};
document.addEventListener("pointerdown", (e) => {
  if (menuOpen && !profMenu.contains(e.target) && e.target !== profMenuBtn && !profMenuBtn.contains(e.target)) closeMenu(false);
}, true);

// ---- new profile (name typed inline) ----
const newBtn = document.getElementById("new");
const newName = document.getElementById("newname");
newBtn.onclick = () => { newName.style.display = "inline-block"; newName.value = ""; newName.focus(); };
newName.onkeydown = (e) => {
  if (e.key === "Enter" && newName.value.trim()) {
    const monitors = {};
    for (const s of screens()) monitors[s.name] = { cols: 3, rows: 1, slots: ["", "", ""] };
    S.configs.push({ name: newName.value.trim(), monitors });
    S.active = S.configs.length;
    W = null;
    saveConfigs();
    newName.style.display = "none";
    render();
  }
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cancelNewName(); }
};
function cancelNewName() { newName.value = ""; newName.style.display = "none"; newName.blur(); }
document.getElementById("apply").onclick = () => post({ action: "apply" });
document.getElementById("applyClose").onclick = () => post({ action: "applyAndClose" });
document.getElementById("resetArr").onclick = () => {
  S.arrange = {};
  post({ action: "resetArrange" });
  render();
};
document.getElementById("applyArr").onclick = () => post({ action: "applyArrange" });
document.getElementById("openAX").onclick = () => post({ action: "openAXSettings" });

// Global handlers are attached exactly once here; render() only sets on*
// properties on freshly created elements, so repeated setState can't stack them.
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.metaKey) { e.preventDefault(); post({ action: "applyAndClose" }); return; }
  if (e.key !== "Escape") return;
  if (menuOpen) { e.preventDefault(); closeMenu(false); profMenuBtn.focus(); return; }
  const t = document.activeElement;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) {
    e.preventDefault();
    if (t === newName) cancelNewName(); else t.blur();
    return;
  }
  if (arrDrag) { arrDrag(true); return; }
  e.preventDefault();
  post({ action: "close" });
});

// Drag ended without a drop (or after one): apply the parked push, if any.
function endChipDrag() {
  chipDragging = false;
  if (!pendingState) return;
  const ps = pendingState; pendingState = null;
  S = ps; W = null; render();
}

// Safety net: a drag that ends off-slot, outside the webview or on a detached chip may
// never fire the chip's own dragend. Bubbling listeners run after slot.ondrop; a new
// press means no drag is in progress. All are no-ops unless a drag is still marked live.
function clearStrayChipDrag() {
  if (!chipDragging) return;
  document.body.classList.remove("is-dragging");
  endChipDrag();
}
document.addEventListener("dragend", clearStrayChipDrag);
document.addEventListener("drop", clearStrayChipDrag);
document.addEventListener("pointerdown", clearStrayChipDrag, true);
document.addEventListener("mousedown", clearStrayChipDrag, true);

window.trisplitSetState = (s) => {
  if (!s || typeof s !== "object") return;
  if (!s.arrange || Array.isArray(s.arrange)) s.arrange = {};
  if (!Array.isArray(s.configs)) s.configs = [];
  s.configs = s.configs.filter((c) => c && typeof c === "object")
    .map((c) => (c.monitors && typeof c.monitors === "object" ? c : { ...c, monitors: {} }));
  if (!Number.isInteger(s.active) || s.active < 1 || s.active > s.configs.length) s.active = 1;
  if (!Array.isArray(s.apps)) s.apps = [];
  if (!Array.isArray(s.screens)) s.screens = [];
  if (chipDragging && Date.now() - chipDragStart > CHIP_DRAG_STALE_MS) {
    chipDragging = false; pendingState = null; document.body.classList.remove("is-dragging");
  }
  if (chipDragging || profileBusy()) { pendingState = s; return; }
  if (arrDrag) arrDrag(true);
  S = s; W = null; render();
};
document.addEventListener("DOMContentLoaded", () => post({ action: "ready" }));
</script>
